name: Refresh market data
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
permissions:
  contents: write
concurrency:
  group: market-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check and update sources
        id: update
        continue-on-error: true
        run: python3 scripts/update.py
      - name: Save valid data and update status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market data and source status'
            git push
          fi
      - name: Report partial failure
        if: steps.update.outcome == 'failure'
        run: exit 1
